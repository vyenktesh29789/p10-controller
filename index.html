<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>P10 Cloud Display</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      background:#0f172a;

      font-family:Arial;

      display:flex;

      justify-content:center;

      align-items:center;

      height:100vh;

      color:white;
    }

    .container{

      width:95%;

      max-width:450px;

      background:#111827;

      padding:30px;

      border-radius:20px;

      box-shadow:0 0 25px rgba(0,0,0,0.4);
    }

    h1{

      text-align:center;

      margin-bottom:25px;

      color:#38bdf8;
    }

    label{

      display:block;

      margin-bottom:8px;

      font-size:16px;
    }

    input{

      width:100%;

      height:50px;

      border:none;

      border-radius:12px;

      padding:12px;

      font-size:18px;

      margin-bottom:20px;

      background:#1e293b;

      color:white;
    }

    button{

      width:100%;

      height:55px;

      border:none;

      border-radius:12px;

      background:#0ea5e9;

      color:white;

      font-size:20px;

      cursor:pointer;

      transition:0.3s;
    }

    button:hover{

      background:#0284c7;
    }

    #status{

      margin-top:20px;

      text-align:center;

      font-size:18px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>P10 Cloud Display</h1>

    <label>Security Key</label>

    <input type="password"
           id="key"
           placeholder="Enter Security Key">

    <label>Scrolling Text</label>

    <input type="text"
           id="message"
           placeholder="Enter Message">

    <button onclick="sendMessage()">

      SEND TO DISPLAY

    </button>

    <div id="status"></div>

  </div>

<script>

const WEBHOOK_URL =
"https://io.adafruit.com/api/v2/webhooks/feed/YOUR_WEBHOOK_ID";

async function sendMessage(){

  const key =
    document.getElementById("key").value;

  const message =
    document.getElementById("message").value;

  if(key !== "1234"){

    alert("Wrong Security Key");

    return;
  }

  if(message.trim() === ""){

    alert("Enter Message");

    return;
  }

  document.getElementById("status").innerHTML =
    "Sending...";

  try{

    const response = await fetch(

      WEBHOOK_URL,

      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          value:message
        })
      }
    );

    if(response.ok){

      document.getElementById("status").innerHTML =
        "Message Sent Successfully";

      document.getElementById("status").style.color =
        "#00ff99";

    }else{

      document.getElementById("status").innerHTML =
        "Failed To Send";

      document.getElementById("status").style.color =
        "red";
    }

  }catch(error){

    console.log(error);

    document.getElementById("status").innerHTML =
      "Network Error";

    document.getElementById("status").style.color =
      "red";
  }
}

</script>

</body>
</html>
